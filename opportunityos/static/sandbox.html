<!doctype html><html lang="en"><meta charset="utf-8"><title>OpportunityOS form sandbox</title>
<script src="/sandbox.js" defer></script>
<h1>Local form-fill sandbox</h1>
<p>This form creates a local test receipt without transmitting any fields.</p>
<form>
<label>Name <input name="name" required></label>
<label>Email <input name="email" type="email" required></label>
<label>University <input name="university"></label>
<button>Create test receipt</button>
</form><output id="receipt" role="status"></output>
</html>
